[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papergroom"
version = "0.1.0"
description = "AI-powered Word document formatter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tb050304" }]
keywords = ["docx", "word", "formatting", "ai", "thesis", "paper"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "python-docx>=1.1",
    "openai>=1.40",
    "pydantic>=2",
    "typer>=0.12",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3.14",
]

[project.scripts]
papergroom = "papergroom.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
papergroom = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
