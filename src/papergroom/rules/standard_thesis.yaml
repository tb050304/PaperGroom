name: standard_thesis
version: 1
description: |
  Built-in ruleset referencing GB/T 7714 and common Chinese thesis specs.
  Values reflect typical undergraduate / postgraduate thesis requirements:
  Song-Ti for body text, bold Hei-Ti for headings, Times New Roman for
  Latin text, 1.5 line spacing. Adjust per your institution's template.

defaults:
  # Latin / default font
  font_name: Times New Roman
  # East Asian font (Chinese / Japanese / Korean)
  font_name_east_asian: 宋体
  font_size_pt: 12
  line_spacing: 1.5
  alignment: justify
  first_line_indent_chars: 2
  color_hex: "000000"

styles:
  title_l1:
    font_name_east_asian: 黑体
    font_size_pt: 16
    bold: true
    alignment: center
    space_before_pt: 24
    space_after_pt: 18
    first_line_indent_chars: 0

  title_l2:
    font_name_east_asian: 黑体
    font_size_pt: 14
    bold: true
    alignment: left
    space_before_pt: 18
    space_after_pt: 12
    first_line_indent_chars: 0

  title_l3:
    font_name_east_asian: 黑体
    font_size_pt: 13
    bold: true
    alignment: left
    space_before_pt: 12
    space_after_pt: 6
    first_line_indent_chars: 0

  body:
    font_size_pt: 12
    alignment: justify
    first_line_indent_chars: 2

  abstract:
    font_size_pt: 10.5
    alignment: justify
    first_line_indent_chars: 2
    space_before_pt: 6
    space_after_pt: 6

  # Cover page info lines like "Name:    Alice".
  # These rows rely on SPACE alignment for layout, so we deliberately
  # leave alignment, indent and font untouched — otherwise the carefully
  # spaced cover layout breaks. Only optional font size normalization is
  # allowed here; everything else inherits the original formatting.
  cover_info:
    font_size_pt: 12

  figure:
    alignment: center
    first_line_indent_chars: 0
    space_before_pt: 6
    space_after_pt: 0

  figure_caption:
    font_name_east_asian: 宋体
    font_size_pt: 10.5
    bold: true
    alignment: center
    first_line_indent_chars: 0
    space_before_pt: 0
    space_after_pt: 12

  table:
    alignment: center
    first_line_indent_chars: 0

  table_caption:
    font_name_east_asian: 宋体
    font_size_pt: 10.5
    bold: true
    alignment: center
    first_line_indent_chars: 0
    space_before_pt: 12
    space_after_pt: 0

  reference:
    font_name_east_asian: 宋体
    font_size_pt: 10.5
    alignment: left
    first_line_indent_chars: 0
    left_indent_pt: 21
    space_before_pt: 0
    space_after_pt: 0

  list_item:
    alignment: left
    first_line_indent_chars: 0
    left_indent_pt: 21

  quote:
    font_name_east_asian: 楷体
    font_size_pt: 11
    alignment: justify
    first_line_indent_chars: 2
    left_indent_pt: 21

  # formula: keep centered, no first-line indent; the applier will NOT
  # touch the inner m:oMath content, only the surrounding paragraph style.
  formula:
    alignment: center
    first_line_indent_chars: 0
    space_before_pt: 6
    space_after_pt: 6

  unknown:
    # Explicitly empty: the applier leaves the paragraph exactly as-is.
    {}
